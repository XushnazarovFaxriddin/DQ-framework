connections:
  source_env_var: PROD_ORA_SW_CONN_STR
  source_type: oracle
  target_env_var: PROD_BQ_ALL_CONN_STR
  target_type: bigquery

alerts:
  routes:
    - kind: gchat
      mode: card
      # send_all_checks: true

tables:
  # SEAWARE.ACC_COUPON
  - name: ACC_COUPON
    source:
      table: SEAWARE.ACC_COUPON
    target:
      query: |
        SELECT *
        FROM (
          SELECT
            user_defined_coupon_id,
            op
          FROM  `prod-shore.nbx_parse.hvtb_parse_sw_rpl_acc_coupon`
          QUALIFY ROW_NUMBER() OVER (
            PARTITION BY user_defined_coupon_id
            ORDER BY ts_ms DESC, lsn DESC
          ) = 1
        )
        WHERE op != 'd'
    checks:
      - type: aggregations
        tolerance_pct: 5.0
        rules:
          - method: distinct_count
            source_col: USER_DEFINED_COUPON_ID
            target_column: user_defined_coupon_id

