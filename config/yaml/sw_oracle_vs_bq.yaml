        rules:
          - method: count   
            source_col: RES_INVOICE_ITEM_ID
            target_column: res_invoice_item_id
          - method: distinct_count    # Distinct count <column>
            source_col: RES_INVOICE_ITEM_ID
            target_column: res_invoice_item_id

