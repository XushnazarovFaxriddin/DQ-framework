    checks:
      - type: aggregations
        tolerance_abs: 10             # absolute tolerance: allow up to 10 units difference
        tolerance_pct: 5.0          # percentage tolerance: allow up to 1% difference
        rules:
          - method: count    
            source_col: RES_INVOICE_ITEM_ID
            target_column: res_invoice_item_id
          - method: distinct_count    # Distinct count <column>
            source_col: "RES_INVOICE_ITEM_ID" # concat columns
            target_column: "res_invoice_item_id"

########################################################################

  - name: RES_INVOICE_CANC_VALIDATION    
