  - Contents: docs/contents.md
  - Getting Started:
      - Install: docs/getting-started/install.md
      - Quickstart (YAML): docs/getting-started/quickstart-yaml.md
  - Concepts:
      - Hashing & Parity: docs/concepts/hashing.md
      - Planner & Partitions: docs/concepts/planner-partitions.md
      - Results Model: docs/concepts/results.md
      - Registry & Plugins: docs/concepts/registry.md
  - Checks:
      - Row Count: docs/checks/row_count.md
      - Schema Drift: docs/checks/schema_drift.md
      - Hash Diff: docs/checks/hash_diff.md
      - Join Rowdiff: docs/checks/join_rowdiff.md
      - Aggregations: docs/checks/aggregations.md
      - Group Aggregations: docs/checks/group_aggregations.md
      - Partitions: docs/checks/partitions.md
      - Domain: docs/checks/domain.md
      - Freshness: docs/checks/freshness.md
      - Custom SQL: docs/checks/custom_sql.md
      - Great Expectations: docs/checks/expectations_ge.md
      - Soda: docs/checks/expectations_soda.md
  - Connectors:
      - BigQuery: docs/connectors/bigquery.md
      - Postgres: docs/connectors/postgres.md
      - Oracle: docs/connectors/oracle.md
      - MSSQL: docs/connectors/mssql.md
      - Snowflake: docs/connectors/snowflake.md
      - CSV (Local): docs/connectors/csv.md
      - GCS CSV: docs/connectors/gcs_csv.md
      - GCS Parquet: docs/connectors/gcs_parquet.md
      - Airtable (stub): docs/connectors/airtable.md
      - REST API (stub): docs/connectors/rest_api.md
  - Alerts:
      - Google Chat: docs/alerts/gchat.md
      - Email (SMTP): docs/alerts/email.md
  - How-To:
      - Run with Docker: docs/how-to/run-docker.md
      - Airflow Integration: docs/how-to/airflow.md
      - Env & Secrets: docs/how-to/env-secrets.md
      - Templating & Variables: docs/how-to/templating.md
      - Concurrency & Timeouts: docs/how-to/concurrency-timeouts.md
      - Results & Reporting: docs/how-to/results-reporting.md
