[project]
name = "dqf"
version = "0.1.0"
description = "Config-driven, pluggable Data Quality Framework"
requires-python = ">=3.11"

dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
  "pandas>=2.2",
  "pyarrow>=17.0.0",
  "requests>=2.32",
  "google-cloud-bigquery>=3.25.0",
  "google-cloud-bigquery-storage>=2.25.0",
  "db-dtypes>=1.3.0",
  "SQLAlchemy>=2.0.31",
  "psycopg2-binary>=2.9.9",
  "oracledb>=2.2.0",         
  "tenacity>=9.0.0",
  "duckdb"
]

[project.scripts]
dqf = "src.main:main"